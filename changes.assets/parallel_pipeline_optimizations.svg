<svg width="100%" viewBox="0 0 880 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="card-seq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1214" />
      <stop offset="100%" stop-color="#281519" />
    </linearGradient>

    <linearGradient id="card-par" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A221C" />
      <stop offset="100%" stop-color="#0E2E26" />
    </linearGradient>

    <linearGradient id="card-fan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2825" />
      <stop offset="100%" stop-color="#0C3430" />
    </linearGradient>

    <linearGradient id="banner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="50%" stop-color="#0B2735" />
      <stop offset="100%" stop-color="#0B2E28" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#06B6D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="880" height="760" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top Header Section -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="112" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#10B981" />
    <text x="24" y="16" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="0.5">PULSEVOICE AI</text>
    
    <text x="124" y="17" font-size="18" font-weight="700" fill="#F8FAFC">Pipeline Optimization &amp; Latency Architecture</text>
    <text x="0" y="44" font-size="13" font-weight="400" fill="#94A3B8">Traditional Sequential Voice Pipeline vs. PulseVoice Concurrent Speculative Execution</text>
  </g>

  <!-- Header Separator Line -->
  <line x1="40" y1="84" x2="840" y2="84" stroke="#1E293B" stroke-width="1" />

  <!-- ==================== LEFT COLUMN: TRADITIONAL SEQUENTIAL ==================== -->
  <!-- Column Header Card -->
  <rect x="40" y="98" width="380" height="42" rx="8" fill="#1E1214" stroke="#7F1D1D" stroke-width="1" />
  <circle cx="58" cy="119" r="4" fill="#EF4444" />
  <text x="70" y="124" font-size="12" font-weight="700" fill="#FCA5A5" letter-spacing="0.5">TRADITIONAL SEQUENTIAL PIPELINE</text>
  <text x="405" y="124" text-anchor="end" font-size="12" font-weight="700" fill="#EF4444">~2,800ms+ DEAD-AIR</text>

  <!-- Step 1 -->
  <rect x="40" y="152" width="380" height="40" rx="6" fill="url(#card-seq)" stroke="#451A1D" stroke-width="1" />
  <text x="56" y="174" font-size="13" font-weight="600" fill="#F8FAFC">1. Cloud API STT Transcription</text>
  <text x="405" y="174" text-anchor="end" font-size="12" font-weight="500" fill="#F87171">~600ms (Serial HTTP)</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="230" y1="192" x2="230" y2="206" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Step 2 -->
  <rect x="40" y="208" width="380" height="40" rx="6" fill="url(#card-seq)" stroke="#451A1D" stroke-width="1" />
  <text x="56" y="230" font-size="13" font-weight="600" fill="#F8FAFC">2. Serial Clinical RAG Search</text>
  <text x="405" y="230" text-anchor="end" font-size="12" font-weight="500" fill="#F87171">~350ms (Uncached Vector DB)</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="230" y1="248" x2="230" y2="262" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Step 3 -->
  <rect x="40" y="264" width="380" height="40" rx="6" fill="url(#card-seq)" stroke="#451A1D" stroke-width="1" />
  <text x="56" y="286" font-size="13" font-weight="600" fill="#F8FAFC">3. Guardrail &amp; Safety Classification</text>
  <text x="405" y="286" text-anchor="end" font-size="12" font-weight="500" fill="#F87171">~400ms (Synchronous Call)</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="230" y1="304" x2="230" y2="318" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Step 4 -->
  <rect x="40" y="320" width="380" height="40" rx="6" fill="url(#card-seq)" stroke="#451A1D" stroke-width="1" />
  <text x="56" y="342" font-size="13" font-weight="600" fill="#F8FAFC">4. Monolithic LLM Tool Decision</text>
  <text x="405" y="342" text-anchor="end" font-size="12" font-weight="500" fill="#F87171">~700ms (High TTFT Wait)</text>

  <!-- Arrow 4 -> 5 -->
  <line x1="230" y1="360" x2="230" y2="374" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Step 5 -->
  <rect x="40" y="376" width="380" height="40" rx="6" fill="url(#card-seq)" stroke="#451A1D" stroke-width="1" />
  <text x="56" y="398" font-size="13" font-weight="600" fill="#F8FAFC">5. Clinic Database Scheduling Query</text>
  <text x="405" y="398" text-anchor="end" font-size="12" font-weight="500" fill="#F87171">~200ms (Blocks Audio Pipeline)</text>

  <!-- Arrow 5 -> 6 -->
  <line x1="230" y1="416" x2="230" y2="430" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Step 6 -->
  <rect x="40" y="432" width="380" height="40" rx="6" fill="url(#card-seq)" stroke="#451A1D" stroke-width="1" />
  <text x="56" y="454" font-size="13" font-weight="600" fill="#F8FAFC">6. Full Batch TTS Generation</text>
  <text x="405" y="454" text-anchor="end" font-size="12" font-weight="500" fill="#F87171">~550ms (Waits for full turn)</text>

  <!-- Arrow 6 -> 7 -->
  <line x1="230" y1="472" x2="230" y2="486" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Step 7 -->
  <rect x="40" y="488" width="380" height="40" rx="6" fill="#2D171A" stroke="#991B1B" stroke-width="1" />
  <text x="56" y="510" font-size="13" font-weight="600" fill="#FCA5A5">7. First Audio Heard by Caller</text>
  <text x="405" y="510" text-anchor="end" font-size="12" font-weight="700" fill="#EF4444">~2,800ms - 3,500ms Delay</text>

  <!-- Left Summary Alert -->
  <rect x="40" y="542" width="380" height="54" rx="8" fill="#1C1012" stroke="#B91C1C" stroke-width="1.2" />
  <text x="230" y="563" text-anchor="middle" font-size="13" font-weight="700" fill="#F87171">TOTAL SERIAL DEAD-AIR: ~2,800ms+</text>
  <text x="230" y="582" text-anchor="middle" font-size="12" font-weight="400" fill="#FCA5A5">Unnatural conversational pauses • High caller abandonment</text>


  <!-- ==================== VERTICAL COLUMN DIVIDER ==================== -->
  <line x1="440" y1="98" x2="440" y2="596" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />


  <!-- ==================== RIGHT COLUMN: PULSEVOICE AI PARALLEL ==================== -->
  <!-- Column Header Card -->
  <rect x="460" y="98" width="380" height="42" rx="8" fill="#09221C" stroke="#059669" stroke-width="1" />
  <circle cx="478" cy="119" r="4" fill="#10B981" />
  <text x="490" y="124" font-size="12" font-weight="700" fill="#6EE7B7" letter-spacing="0.5">PULSEVOICE AI PARALLEL PIPELINE</text>
  <text x="825" y="124" text-anchor="end" font-size="12" font-weight="700" fill="#10B981">~400ms PERCEIVED (3.5×)</text>

  <!-- Step 1: Ingestion + In-Memory STT -->
  <rect x="460" y="152" width="380" height="40" rx="6" fill="url(#card-par)" stroke="#065F46" stroke-width="1" />
  <text x="476" y="174" font-size="13" font-weight="600" fill="#F8FAFC">1. 24 kHz WebSocket + Faster-Whisper</text>
  <text x="825" y="174" text-anchor="end" font-size="12" font-weight="600" fill="#34D399">~160ms (CUDA FP16)</text>

  <!-- 3-Way Parallel Fork Lines -->
  <line x1="650" y1="192" x2="650" y2="204" stroke="#10B981" stroke-width="1.5" />
  <line x1="520" y1="204" x2="780" y2="204" stroke="#10B981" stroke-width="1.5" />
  <line x1="520" y1="204" x2="520" y2="212" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <line x1="650" y1="204" x2="650" y2="212" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <line x1="780" y1="204" x2="780" y2="212" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- 3 Parallel Fan-Out Cards -->
  <!-- Card A: Speculative RAG -->
  <rect x="460" y="212" width="120" height="66" rx="6" fill="url(#card-fan)" stroke="#0D9488" stroke-width="1" />
  <text x="520" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#5EEAD4">Speculative RAG</text>
  <text x="520" y="248" text-anchor="middle" font-size="11" font-weight="500" fill="#99F6E4">FAISS + BM25</text>
  <text x="520" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#2DD4BF">~150ms prefetch</text>

  <!-- Card B: Semantic Cache -->
  <rect x="590" y="212" width="120" height="66" rx="6" fill="url(#card-fan)" stroke="#0D9488" stroke-width="1" />
  <text x="650" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#5EEAD4">Semantic Cache</text>
  <text x="650" y="248" text-anchor="middle" font-size="11" font-weight="500" fill="#99F6E4">Cosine ≥ 0.88</text>
  <text x="650" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#2DD4BF">&lt; 5ms (Zero LLM)</text>

  <!-- Card C: Instant Filler Stream -->
  <rect x="720" y="212" width="120" height="66" rx="6" fill="url(#card-fan)" stroke="#0D9488" stroke-width="1" />
  <text x="780" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#5EEAD4">Instant Filler</text>
  <text x="780" y="248" text-anchor="middle" font-size="11" font-weight="500" fill="#99F6E4">Audio Stream</text>
  <text x="780" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#38BDF8">~400ms perceived</text>

  <!-- Converge Lines to Step 2 -->
  <line x1="520" y1="278" x2="520" y2="288" stroke="#10B981" stroke-width="1.5" />
  <line x1="650" y1="278" x2="650" y2="288" stroke="#10B981" stroke-width="1.5" />
  <line x1="780" y1="278" x2="780" y2="288" stroke="#10B981" stroke-width="1.5" />
  <line x1="520" y1="288" x2="780" y2="288" stroke="#10B981" stroke-width="1.5" />
  <line x1="650" y1="288" x2="650" y2="298" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- Step 2: Multi-Tier LLM Resiliency Engine -->
  <rect x="460" y="300" width="380" height="46" rx="6" fill="url(#card-par)" stroke="#065F46" stroke-width="1" />
  <text x="476" y="320" font-size="13" font-weight="600" fill="#F8FAFC">2. Multi-Tier LLM Resiliency Engine</text>
  <text x="825" y="320" text-anchor="end" font-size="12" font-weight="700" fill="#38BDF8">Groq ~280ms TTFT</text>
  <text x="476" y="337" font-size="11" font-weight="400" fill="#94A3B8">Automated Failover: Groq (gpt-oss-20b) → Gemini 3.6 Flash → OpenRouter</text>

  <!-- 2-Way Concurrent Branch -->
  <line x1="650" y1="346" x2="650" y2="356" stroke="#10B981" stroke-width="1.5" />
  <line x1="550" y1="356" x2="750" y2="356" stroke="#10B981" stroke-width="1.5" />
  <line x1="550" y1="356" x2="550" y2="364" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <line x1="750" y1="356" x2="750" y2="364" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- Concurrent Sub-task A: Aggressive Chunker -->
  <rect x="460" y="364" width="180" height="52" rx="6" fill="url(#card-fan)" stroke="#0D9488" stroke-width="1" />
  <text x="550" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#5EEAD4">Aggressive Chunker</text>
  <text x="550" y="403" text-anchor="middle" font-size="11" font-weight="500" fill="#99F6E4">O(1) Punctuation Stream</text>

  <!-- Concurrent Sub-task B: DB Pre-Query -->
  <rect x="660" y="364" width="180" height="52" rx="6" fill="url(#card-fan)" stroke="#0D9488" stroke-width="1" />
  <text x="750" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#5EEAD4">In-Memory DB Pre-Query</text>
  <text x="750" y="403" text-anchor="middle" font-size="11" font-weight="500" fill="#99F6E4">~0ms Wait (Cached Slots)</text>

  <!-- Converge lines to Kokoro TTS -->
  <line x1="550" y1="416" x2="550" y2="426" stroke="#10B981" stroke-width="1.5" />
  <line x1="750" y1="416" x2="750" y2="426" stroke="#10B981" stroke-width="1.5" />
  <line x1="550" y1="426" x2="750" y2="426" stroke="#10B981" stroke-width="1.5" />
  <line x1="650" y1="426" x2="650" y2="436" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- Step 3: Kokoro TTS Stream -->
  <rect x="460" y="438" width="380" height="40" rx="6" fill="url(#card-par)" stroke="#065F46" stroke-width="1" />
  <text x="476" y="460" font-size="13" font-weight="600" fill="#F8FAFC">3. Kokoro-82M ONNX 24 kHz Neural TTS</text>
  <text x="825" y="460" text-anchor="end" font-size="12" font-weight="600" fill="#34D399">Streaming Audio</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="650" y1="478" x2="650" y2="490" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- Step 4: First Word Heard -->
  <rect x="460" y="492" width="380" height="40" rx="6" fill="#0B3026" stroke="#10B981" stroke-width="1" />
  <text x="476" y="514" font-size="13" font-weight="600" fill="#A7F3D0">4. Perceived Audio Output to Caller</text>
  <text x="825" y="514" text-anchor="end" font-size="12" font-weight="700" fill="#34D399">~400ms Audio Start</text>

  <!-- Right Summary Success Card -->
  <rect x="460" y="542" width="380" height="54" rx="8" fill="#09261E" stroke="#059669" stroke-width="1.2" />
  <text x="650" y="563" text-anchor="middle" font-size="13" font-weight="700" fill="#34D399">PERCEIVED LATENCY: ~400ms (3.5× FASTER)</text>
  <text x="650" y="582" text-anchor="middle" font-size="12" font-weight="400" fill="#A7F3D0">Zero dead-air • Natural conversational cadence • Sub-second TTFA</text>


  <!-- ==================== BOTTOM METRICS BENCHMARK BANNER ==================== -->
  <rect x="40" y="612" width="800" height="126" rx="10" fill="url(#banner-grad)" stroke="#059669" stroke-width="1" stroke-opacity="0.4" />

  <!-- Banner Header -->
  <text x="56" y="632" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="0.5">VERIFIED CLINICAL PRODUCTION BENCHMARKS (PULSEVOICE AI EVALUATION)</text>

  <!-- Metric Card 1: Medical Accuracy -->
  <rect x="56" y="644" width="180" height="80" rx="6" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
  <text x="146" y="670" text-anchor="middle" font-size="18" font-weight="800" fill="#10B981">87.7% - 100%</text>
  <text x="146" y="692" text-anchor="middle" font-size="12" font-weight="600" fill="#F8FAFC">Medical Term Accuracy</text>
  <text x="146" y="710" text-anchor="middle" font-size="11" font-weight="400" fill="#94A3B8">52 clinical test domains</text>

  <!-- Metric Card 2: WER -->
  <rect x="250" y="644" width="180" height="80" rx="6" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
  <text x="340" y="670" text-anchor="middle" font-size="18" font-weight="800" fill="#38BDF8">9.3% WER</text>
  <text x="340" y="692" text-anchor="middle" font-size="12" font-weight="600" fill="#F8FAFC">Speech Recognition</text>
  <text x="340" y="710" text-anchor="middle" font-size="11" font-weight="400" fill="#94A3B8">Faster-Whisper CUDA FP16</text>

  <!-- Metric Card 3: Call Completion Rate -->
  <rect x="444" y="644" width="180" height="80" rx="6" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
  <text x="534" y="670" text-anchor="middle" font-size="18" font-weight="800" fill="#A855F7">100% Uptime</text>
  <text x="534" y="692" text-anchor="middle" font-size="12" font-weight="600" fill="#F8FAFC">Call Completion Rate</text>
  <text x="534" y="710" text-anchor="middle" font-size="11" font-weight="400" fill="#94A3B8">0 dropped calls / failover</text>

  <!-- Metric Card 4: Net Latency Reduction -->
  <rect x="638" y="644" width="186" height="80" rx="6" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
  <text x="731" y="670" text-anchor="middle" font-size="18" font-weight="800" fill="#F59E0B">3.5× Faster</text>
  <text x="731" y="692" text-anchor="middle" font-size="12" font-weight="600" fill="#F8FAFC">Net Latency Reduction</text>
  <text x="731" y="710" text-anchor="middle" font-size="11" font-weight="400" fill="#94A3B8">~1,600ms latency saved</text>
</svg>